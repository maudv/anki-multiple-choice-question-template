<!---------
BACK TEMPLATE
Custom
Orixinal: https://github.com/muctebanesiri/anki-multiple-choice-question-template/tree/main
--------------->
<div id="myCard">
  <main class="back">
    <div class="question">{{Question}}</div>
    <div id="options">
      {{#A}}<div class="option" data-letter="A"><div class="text">{{A}}</div></div>{{/A}}
      {{#B}}<div class="option" data-letter="B"><div class="text">{{B}}</div></div>{{/B}}
      {{#C}}<div class="option" data-letter="C"><div class="text">{{C}}</div></div>{{/C}}
      {{#D}}<div class="option" data-letter="D"><div class="text">{{D}}</div></div>{{/D}}
    </div>

    {{#Explanation}}
    <details class="explanation" open>
      <summary>Explanation</summary>
      <div>{{Explanation}}</div>
    </details>
    {{/Explanation}}
  </main>

  <div id="settings">
    <button id="gear">⚙</button>
    <div id="panel">
      <button id="zoom-out">−</button>
      <button id="zoom-reset">100%</button>
      <button id="zoom-in">+</button>
      <label>Shuffling <input id="shuffling" type="checkbox"></label>
    </div>
  </div>
</div>

<!--
Persistence script for storing the shuffled answers and settings like zoom level or auto-submit and shuffle toggles
Script taken from https://github.com/SimonLammer/anki-persistence/releases/tag/v1.1.8
The .js file must exist in ~/.local/share/Anki2/User\ 1/collection.media/
-->
<script src="_persistence.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = (k, d) => { const v = Persistence.getItem(k); return v == null ? d : v; };

  const opts = $("#options");
  const items = [...opts.children];
  const shuffling = $("#shuffling");

  // ----- mark right / wrong ("B" or "2" both work)
  const raw = "{{text:Answer}}".trim().toUpperCase();
  const correct = /^\d$/.test(raw) ? "ABCD"[raw - 1] : raw;
  const picked = store("answer", "");

  items.forEach((o) => {
    const l = o.dataset.letter;
    o.classList.toggle("correct", l === correct);
    o.classList.toggle("wrong", l === picked && l !== correct);
  });

  // ----- order chosen on the front
  const saved = String(store("order", ""))
    .split("")
    .map((l) => items.find((o) => o.dataset.letter === l))
    .filter(Boolean);

  function applyOrder() {
    const shuffled = shuffling.checked && saved.length === items.length;
    (shuffled ? saved : items).forEach((el) => opts.appendChild(el));
    opts.classList.toggle("shuffled", shuffled);
  }
  shuffling.checked = store("ShufflingBox", true);
  shuffling.onchange = () => { Persistence.setItem("ShufflingBox", shuffling.checked); applyOrder(); };
  applyOrder();

  // ----- zoom + settings
  let zoom = store("Zoom", 1);
  const setZoom = (z) => {
    zoom = Math.max(0.3, Math.round(z * 10) / 10);
    Persistence.setItem("Zoom", zoom);
    document.documentElement.style.setProperty("--zoom", zoom);
  };
  setZoom(zoom);
  $("#zoom-in").onclick = () => setZoom(zoom + 0.1);
  $("#zoom-out").onclick = () => setZoom(zoom - 0.1);
  $("#zoom-reset").onclick = () => setZoom(1);
  $("#gear").onclick = () => $("#panel").classList.toggle("open");
})();
</script>
